[project]
name = "rawstage"
version = "0.1.0"
description = "Raw-style comic stage renderer — parses ComicDirector ML XML and outputs video"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "lxml>=5.0",
]

[project.scripts]
rawstage = "rawstage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
